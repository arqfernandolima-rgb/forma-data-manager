<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forma Data Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" id="sidebar" hidden>
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <div class="brand-name">Forma Data Manager</div>
            <div class="brand-sub" id="side-hub">No hub</div>
          </div>
        </div>
        <nav>
          <button class="nav-item active" data-page="status">Status</button>
          <button class="nav-item" data-page="history">History</button>
          <button class="nav-item" data-page="claude">Claude setup</button>
          <button class="nav-item" data-page="settings">Settings</button>
          <button class="nav-item" data-page="about">About</button>
        </nav>
        <div class="side-foot">
          <div id="side-user" class="muted small"></div>
          <div class="unofficial small">Unofficial test tool · not an Autodesk product</div>
        </div>
      </aside>
      <main id="main"></main>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="changes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
