name: Release

# Push a tag like v4.0.0 to build the Windows installer and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check versions match the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in engine/package.json desktop/package.json; do
            V=$(node -p "require('./$f').version")
            [ "$V" = "$TAG" ] || { echo "$f is $V but the tag is $TAG"; exit 1; }
          done

      - name: Test and compile engine
        working-directory: engine
        run: |
          bun install --frozen-lockfile
          bun test
          bun run compile:win

      - name: Build installer
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm run dist

      - name: Checksums
        shell: pwsh
        working-directory: desktop/dist
        run: |
          Get-ChildItem *.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Release notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          # This version's section of CHANGELOG.md (from its "## <ver>" heading to the next "## ").
          awk -v v="$VER" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > changes.md
          {
            echo "> **Unofficial test build, provided as is.** Not an Autodesk product; not supported or warranted by Autodesk or Anthropic. Read the [disclaimer](${REPO}/blob/main/DISCLAIMER.md) before installing."
            echo
            echo "## Install"
            echo
            echo "1. Download **Forma-Data-Manager-Setup-${VER}.exe** below (Windows 10/11, x64). It isn't code-signed, so if SmartScreen warns, choose **More info → Run anyway**. You can check it against \`SHA256SUMS.txt\`."
            echo "2. Run it. No admin rights needed. The setup wizard walks you through the rest."
            echo "3. Before you start, you need an APS client ID added to your hub and **Executive Overview** access: see [APS app setup](${REPO}/blob/main/docs/aps-app-setup.md) (about 5 minutes)."
            echo
            echo "Already installed? Install this over it: settings, sign-in and data are kept."
            echo
            echo "Guide: [README](${REPO}#readme) · [Troubleshooting](${REPO}/blob/main/docs/troubleshooting.md) · [Report an issue](${REPO}/issues) (never attach extracts or project data)"
            echo
            echo "## What's new in ${VER}"
            echo
            cat changes.md
          } > notes.md
          cat notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # vX.Y.Z is a normal release (and the latest); vX.Y.Z-anything (e.g. -beta.1) is a pre-release.
          case "$GITHUB_REF_NAME" in
            *-*) KIND="--prerelease" ;;
            *) KIND="--latest" ;;
          esac
          gh release create "$GITHUB_REF_NAME" desktop/dist/Forma-Data-Manager-Setup-*.exe desktop/dist/SHA256SUMS.txt \
            --title "Forma Data Manager $GITHUB_REF_NAME" --notes-file notes.md $KIND
